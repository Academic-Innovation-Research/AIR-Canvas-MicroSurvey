services:
  db:
    image: mysql:8.1
    container_name: mysql-container
    restart: always
    volumes:
      - db-data:/var/lib/mysql
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_USER_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
    ports:
      - "127.0.0.1:3306:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p${DB_PASSWORD} --silent"]
      interval: 10s
      timeout: 10s
      retries: 5
    networks:
      - app-network
    command: --default-authentication-plugin=mysql_native_password
      
  # Matches production, which replaced phpMyAdmin with Adminer after
  # phpMyAdmin leaked memory. Production serves it on 8080; 8081 here keeps
  # the port this repo has always used and avoids common 8080 clashes.
  adminer:
    image: adminer:4.8.1
    container_name: adminer-container
    restart: always
    depends_on:
      - db
    environment:
      ADMINER_DEFAULT_SERVER: db
    ports:
      - "8081:8080"
    networks:
      - app-network

  # Metabase's APPLICATION database — dashboards, questions, users, permissions.
  # Distinct from `db` above, which holds the analytics data Metabase queries.
  #
  # This replaces the default H2 file. H2 cannot be backed up while Metabase is
  # running, has no incremental or partial restore, and is a single binary blob
  # that Metabase does not recommend for production. On Postgres, backing up
  # every dashboard is an ordinary pg_dump.
  metabase-app-db:
    image: postgres:16
    container_name: metabase-postgres
    restart: always
    volumes:
      - mb-app-data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${MB_APP_DB_NAME}
      POSTGRES_USER: ${MB_APP_DB_USER}
      POSTGRES_PASSWORD: ${MB_APP_DB_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${MB_APP_DB_USER} -d ${MB_APP_DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  metabase:
    # Pinned to match production (dbdkr). The Metabase application database
    # migrates forward only: an app DB from v0.55.12 will not boot on an older
    # build, so this must not drift below production's version.
    image: metabase/metabase:v0.55.12
    container_name: metabase-container
    restart: always
    platform: linux/amd64
    networks:
      - app-network
    depends_on:
      db:
        condition: service_healthy
      metabase-app-db:
        condition: service_healthy
    # No bind mount. The H2 volume `./:/metabase.db` was dropped once the app
    # DB moved to Postgres: Metabase no longer read it, and the entrypoint
    # chowns /metabase.db to its own uid (2000), locking the host user out of
    # this directory — including git checkouts of this file.
    environment:
      JAVA_TIMEZONE: ${MB_JAVA_TIMEZONE}
      MB_DB_TYPE: postgres
      MB_DB_HOST: metabase-app-db
      MB_DB_PORT: 5432
      MB_DB_DBNAME: ${MB_APP_DB_NAME}
      MB_DB_USER: ${MB_APP_DB_USER}
      MB_DB_PASS: ${MB_APP_DB_PASSWORD}
    ports:
      - "3000:3000"

networks:
  app-network:
    driver: bridge

volumes:
  db-data:
  mb-app-data:
