services:
  db:
    image: mysql:8.1
    container_name: mysql-container
    restart: always
    platform: linux/arm64
    volumes:
      - db-data:/var/lib/mysql
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_USER_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p${DB_PASSWORD} --silent"]
      interval: 10s
      timeout: 10s
      retries: 5
    networks:
      - app-network
    command: --default-authentication-plugin=mysql_native_password
      
  phpmyadmin:
    image: phpmyadmin:5.2.1
    container_name: phpmyadmin-container
    restart: always
    depends_on:
      - db
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_USER_PASSWORD}
      UPLOAD_LIMIT: 256M
      PHP_MAX_EXECUTION_TIME: 300
    ports:
      - "8081:80"
    networks:
      - app-network
    platform: linux/arm64

  # Metabase's APPLICATION database — dashboards, questions, users, permissions.
  # Distinct from `db` above, which holds the analytics data Metabase queries.
  #
  # This replaces the default H2 file. H2 cannot be backed up while Metabase is
  # running, has no incremental or partial restore, and is a single binary blob
  # that Metabase does not recommend for production. On Postgres, backing up
  # every dashboard is an ordinary pg_dump.
  metabase-app-db:
    image: postgres:16
    container_name: metabase-postgres
    restart: always
    volumes:
      - mb-app-data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${MB_APP_DB_NAME}
      POSTGRES_USER: ${MB_APP_DB_USER}
      POSTGRES_PASSWORD: ${MB_APP_DB_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${MB_APP_DB_USER} -d ${MB_APP_DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  metabase:
    # Pinned to match production (dbdkr). The Metabase application database
    # migrates forward only: an app DB from v0.55.12 will not boot on an older
    # build, so this must not drift below production's version.
    image: metabase/metabase:v0.55.12
    container_name: metabase-container
    restart: always
    platform: linux/amd64
    networks:
      - app-network
    depends_on:
      db:
        condition: service_healthy
      metabase-app-db:
        condition: service_healthy
    volumes:
      # Retained after the Postgres migration so the old H2 file stays available
      # as a rollback point. Metabase no longer reads it — MB_DB_TYPE wins.
      - ./:/metabase.db
    environment:
      JAVA_TIMEZONE: ${MB_JAVA_TIMEZONE}
      MB_DB_TYPE: postgres
      MB_DB_HOST: metabase-app-db
      MB_DB_PORT: 5432
      MB_DB_DBNAME: ${MB_APP_DB_NAME}
      MB_DB_USER: ${MB_APP_DB_USER}
      MB_DB_PASS: ${MB_APP_DB_PASSWORD}
    ports:
      - "3000:3000"

networks:
  app-network:
    driver: bridge

volumes:
  db-data:
  mb-app-data:
